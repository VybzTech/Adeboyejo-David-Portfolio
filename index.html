<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Diamond Scrollbar</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 2rem;
            /* Hide default scrollbar for a clean custom container look */
            overflow: hidden; 
        }

        /* Scroll Container */
        .scroll-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            box-sizing: border-box;
            padding-right: 30px; /* Space for custom scrollbar */
        }

        /* Fake Content to force scrolling */
        .content {
            height: 300vh;
            background: linear-gradient(180deg, #0b0f19 0%, #1a1c2e 50%, #0b0f19 100%);
            padding: 40px;
        }

        /* --- THE CUSTOM SCROLLBAR TRACK --- */
        .custom-scrollbar-track {
            position: fixed;
            top: 10px;
            right: 15px;
            width: 8px;
            height: calc(100vh - 20px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            z-index: 9999;
        }

        /* --- THE FILL EFFECT (Bottle Filling) --- */
        .scrollbar-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%; /* Driven by JS */
            background: linear-gradient(180deg, #00d2ff, #0066ff);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.8);
        }

        /* --- THE SHINING DIAMOND THUMB --- */
        .scrollbar-thumb-diamond {
            position: absolute;
            left: 50%;
            top: 0%; /* Driven by JS */
            transform: translate(-50%, -50%) rotate(45deg);
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #e6f7ff 0%, #00d2ff 50%, #0051ff 100%);
            border: 2px solid #ffffff;
            box-shadow: 
                0 0 15px #00d2ff, 
                0 0 30px #0051ff,
                inset 0 0 4px rgba(255,255,255,0.8);
            cursor: pointer;
            z-index: 10000;
            animation: shimmer 2s infinite alternate;
        }

        /* --- LIGHT SPARK EFFECT --- */
        .scrollbar-thumb-diamond::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 4px #fff, 0 0 20px 8px #00d2ff;
            animation: spark-move 4s infinite linear;
        }

        /* --- ANIMATIONS --- */
        @keyframes shimmer {
            0% {
                filter: brightness(1) drop-shadow(0 0 5px #00d2ff);
            }
            100% {
                filter: brightness(1.4) drop-shadow(0 0 20px #00d2ff);
            }
        }

        @keyframes spark-move {
            0% { top: -2px; left: -2px; }
            25% { top: -2px; left: 14px; }
            50% { top: 14px; left: 14px; }
            75% { top: 14px; left: -2px; }
            100% { top: -2px; left: -2px; }
        }
    </style>
</head>
<body>

    <div class="scroll-container" id="scrollContainer">
        <!-- Custom Scrollbar Elements -->
        <div class="custom-scrollbar-track">
            <div class="scrollbar-fill" id="scrollbarFill"></div>
            <div class="scrollbar-thumb-diamond" id="scrollbarThumb"></div>
        </div>

        <!-- Your actual website content goes here -->
        <div class="content">
            <h2>Shining Diamond Scrollbar Demo</h2>
            <p>Scroll down to watch the liquid blue mana fill the container track...</p>
            <p style="margin-top: 500px;">Keep scrolling! The diamond tip tracks your progress...</p>
            <p style="margin-top: 500px;">Almost at the bottom of the bottle!</p>
        </div>
    </div>

    <script>
        const container = document.getElementById('scrollContainer');
        const fill = document.getElementById('scrollbarFill');
        const thumb = document.getElementById('scrollbarThumb');

        container.addEventListener('scroll', () => {
            // Calculate how far down the user has scrolled in percentage
            const totalScrollableHeight = container.scrollHeight - container.clientHeight;
            const currentScrollPosition = container.scrollTop;
            
            const scrollPercentage = (currentScrollPosition / totalScrollableHeight) * 100;

            // 1. Update the "bottle fill" height
            fill.style.height = `${scrollPercentage}%`;

            // 2. Move the diamond thumb precisely with the fill level
            thumb.style.top = `${scrollPercentage}%`;
        });
    </script>
</body>
</html>
